<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Health++</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); background: #101b21; color: #f3efe3; font: 15px system-ui, sans-serif; }
    header { flex: 0 0 auto; min-height: 52px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 12px; flex-wrap: wrap; }
    #save-status { flex: 1 1 140px; max-width: 420px; min-width: 0; overflow-wrap: anywhere; font-size: 13px; }
    button { flex-shrink: 0; max-width: 100%; min-height: 48px; overflow-wrap: anywhere; border: 1px solid #b5c6a0; border-radius: 8px; padding: 10px 16px; background: #d9e8bd; color: #15211b; cursor: pointer; font: inherit; }
    button:disabled { opacity: .5; cursor: wait; }
    #game-viewport { flex: 1 1 0; min-height: 0; position: relative; display: grid; place-items: center; overflow: hidden; }
    #unity-canvas { display: block; width: 100%; height: 100%; background: #101b21; }
    #account-gate { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: 12px; overflow-y: auto; padding: 24px 20px; background: #101b21; z-index: 2; text-align: center; }
    #account-gate > * { flex-shrink: 0; width: 100%; max-width: 420px; margin: 0; }
    #account-message { line-height: 1.6; overflow-wrap: anywhere; }
    #conflict { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body>
  <header>
    <span id="save-status" role="status">Health++</span>
    <button id="retry" hidden>Retry</button>
    <button id="sign-out" hidden>Sign out</button>
  </header>
  <main id="game-viewport">
  <canvas id="unity-canvas" width="540" height="960" tabindex="-1"></canvas>
  <section id="account-gate" aria-live="polite">
    <h1>Health++</h1>
    <p id="account-message">Loading Health++…</p>
    <button id="sign-in" hidden>Sign in with Google</button>
    <button id="continue-guest" hidden>Continue as guest</button>
    <div id="conflict" hidden>
      <button id="use-local">Use this device's progress</button>
      <button id="use-cloud">Use account progress</button>
    </div>
  </section>
  </main>
  <script type="module" src="portrait-viewport.mjs"></script>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    window.startHealthUnity = () => createUnityInstance(document.querySelector("#unity-canvas"), {
      arguments: [],
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
      workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    }, progress => {
      document.querySelector("#account-message").textContent = "Loading Health++: " + Math.round(progress * 100) + "%";
    });
  </script>
  <script type="module" src="cloud.js"></script>
</body>
</html>
